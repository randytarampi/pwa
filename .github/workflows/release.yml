name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.actor != 'github-actions[bot]' }}
    environment: production
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Run `git checkout`
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify the CI run matches this commit
        run: |
          if [ "${{ github.event.workflow_run.head_sha }}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::CI run head ${{ github.event.workflow_run.head_sha }} does not match checkout $(git rev-parse HEAD) - skipping release"
            exit 1
          fi

      - name: Setup node@24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install

      - name: Check for publishable changes
        id: changed
        run: |
          if [ -n "$(npx lerna changed -alp || true)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Version packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: npx lerna version --conventional-commits --yes

      - name: Publish packages
        if: ${{ steps.changed.outputs.has_changes == 'true' }}
        run: npx lerna publish from-git --yes --provenance
